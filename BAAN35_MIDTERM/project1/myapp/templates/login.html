{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{% static 'Images/logo2.png' %}">
    <title>Login</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        * {
        box-sizing: border-box;   
        }
        body {
            background-color: #fcfcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #login_box {
            width: 100%;
            max-width: 360px;       
            padding: 10px 30px 35px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #login_box h1 {
            margin: 0 0 20px;
            padding-top: 0;
        }

        #login_box form {
            width: 100%;  
        }

        .input_box {
            position: relative;
            width: 100%;
            margin: 20px 0;
        }

        .input-field {
            display: block;
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            border: none;
            border-bottom: 2px solid #ccc;
            outline: none;
            background-color: transparent;
        }

        .input-label {
            position: absolute;
            top: 10px;
            left: 0;
            font-size: 16px;
            color: #999;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: -14px;
            font-size: 12px;
            color: #fdc22f;
        }

        .input-highlight {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            width: 0;
            background-color: #fdc22f;
            transition: width 0.3s ease;
        }

        .input-field:focus ~ .input-highlight {
            width: 100%;
        }

        #submit-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #fdc22f;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .error-msg {
            margin: 0;
            padding: 0;
            line-height: 1;
            font-size: 14px;
            color: red;
            text-align: left;
        }

        #copyright {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        #login_logo {
            display: block;
            width: 200px;
            height: auto;
            margin: 0 auto 0px;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="login_box">
        <img src = {% static 'Images/logo (2).png' %} alt="Logo" id = "login_logo">
        <form method="POST">
            {% csrf_token %}

            <div class="input_box">
                <input class="input-field" type="text" id="username" name="username" placeholder=" " required>
                <label for="username" class="input-label">Username</label>
                <span class="input-highlight"></span>
            </div>

            <div class="input_box">
                <input class="input-field" type="password" id="password" name="password" placeholder=" " required>
                <label for="password" class="input-label">Password</label>
                <span class="input-highlight"></span>
            </div>

            {% if error %}
                <p class = "error-msg">{{ error }}</p>
            {% endif %} 

            <button id = "submit-btn" type="submit">Login</button>
        </form>
    </div>
    <p id = "copyright"> ©2026 Atena Analysis | All rights reserved. </p>
</body>
</html>
