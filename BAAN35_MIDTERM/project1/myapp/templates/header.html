{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{% static 'Images/logo2.png' %}">
    <title>{% block title %}Atena Analytics{% endblock %}</title>
    <style>
        :root {
            --sidebar-width: 260px;
            --primary: #F1700D;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #fcfcfc;
            font-family: 'Inter', sans-serif;
        }

        #nav-bar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 25px 0;
            overflow-y: auto;
            z-index: 100;
            box-sizing: border-box;
            background-color: #fdc22f;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

            #nav-bar {
        margin: 0;
        padding: 0;
        width: 260px;
        height: 100vh;
        position: fixed;
        padding: 25px 0;
        overflow-y: auto;
        z-index: 100;
        background-color: #fdc22f;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .nav-item {
        padding: 12px 30px;
        display: flex;
        align-items: center;
        cursor: pointer;
        transition: 0.2s;
        color: #ffffff;
        font-weight: 500;
        font-size: 0.9rem;
        text-decoration: none; 
        font-weight: bold;
    }

    .nav-item i {
        width: 25px;
    }

    .nav-item:hover {
        background: #F1700D;
        opacity: 0.8;
    }

    .nav-item.active {
        background: var(--primary);
        color: white;
        border-radius: 0 30px 30px 0;
        margin-right: 15px;
    }

    #display_logo {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #logo {
        width: 220px;
        height: auto;
    }

    .nav-label {
    padding: 8px 30px 2px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #fcfcfc;
    letter-spacing: 0.08em;
    }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav id="nav-bar">
        <div id="display_logo">
            <a href="{% url 'import_file' %}">
                <img id="logo" src="{% static 'Images/white_logo.png' %}" alt="Logo">
            </a>
        </div>
        <p class="nav-label">VISUALIZATION</p>
        <a class="nav-item" href="{% url 'import_file' %}">VISUALIZE</a>
        <a class = "nav-item" href="{% url 'clean' %}">DATA CLEANING</a>
        <a class="nav-item" href="{% url 'convert' %}">FILE CONVERSION</a>
        <a class="nav-item" href="{% url 'createuser' %}">CREATE USER</a>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
